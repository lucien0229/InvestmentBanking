# Local Supabase Auth contract only. Production must set the same RP identity
# through the managed project configuration and verify it before enabling Deal data.

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Deal Control"
rp_id = "localhost"
rp_origins = ["http://localhost:3000"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
