name: investmentbanking-dev

x-worker: &worker
  image: ${NODE_RUNTIME_IMAGE:-node:22-bookworm-slim}
  environment: &worker_environment
    APP_ENV: ${APP_ENV:-development}
    RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must identify this immutable release}
    JOB_EXECUTION_MODE: external
    DATABASE_SSL_CA_FILE: /run/secrets/supabase-chain.pem
  volumes:
    - ${APP_RELEASE_PATH:?APP_RELEASE_PATH is required}:/opt/app:ro
    - ${DATABASE_SSL_CA_HOST_PATH:?DATABASE_SSL_CA_HOST_PATH is required}:/run/secrets/supabase-chain.pem:ro
  working_dir: /opt/app
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  pids_limit: 64
  networks: [private]
  deploy:
    resources:
      limits: { cpus: "0.50", memory: 256M, pids: 64 }

services:
  api:
    image: ${NODE_RUNTIME_IMAGE:-node:22-bookworm-slim}
    env_file:
      - path: ${RUNTIME_ENV_FILE:-./runtime.env}
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      RELEASE_ID: ${RELEASE_ID:?RELEASE_ID must identify this immutable release}
      HOST: 0.0.0.0
      PORT: 3001
      PROTECTED_STORAGE_ROOT: /var/lib/investmentbanking/protected
      DATABASE_SSL_CA_FILE: /run/secrets/supabase-chain.pem
      OFFICE_RENDERER_SOCKET: /run/office/renderer.sock
      SOURCE_INSPECTOR_SOCKET: /run/office/source-repair.sock
      PUBLIC_FETCH_SOCKET: /run/public-fetch/fetch.sock
      JOB_EXECUTION_MODE: external
    command:
      - node
      - /opt/app/node_modules/tsx/dist/cli.mjs
      - /opt/app/apps/api/src/server.ts
    ports:
      - "127.0.0.1:${INVESTMENTBANKING_DEV_API_PORT:-3101}:3001"
    volumes:
      - type: bind
        source: ${APP_RELEASE_PATH:?APP_RELEASE_PATH must point to an immutable application release}
        target: /opt/app
        read_only: true
      - type: bind
        source: ${PROTECTED_VOLUME_PATH:-./volumes/protected}
        target: /var/lib/investmentbanking/protected
      - type: bind
        source: ${DATABASE_SSL_CA_HOST_PATH:-./supabase-chain.pem}
        target: /run/secrets/supabase-chain.pem
        read_only: true
      - type: bind
        source: ${OFFICE_SOCKET_DIRECTORY:?OFFICE_SOCKET_DIRECTORY must point to the dedicated rootless supervisor socket directory}
        target: /run/office
        read_only: true
      - type: bind
        source: ${ARTIFACT_IDENTITY_DIRECTORY:?ARTIFACT_IDENTITY_DIRECTORY must point to the workload token directory}
        target: /run/artifact-identity
        read_only: true
      - type: bind
        source: ${PUBLIC_FETCH_SOCKET_DIRECTORY:?PUBLIC_FETCH_SOCKET_DIRECTORY is required}
        target: /run/public-fetch
        read_only: true
    group_add:
      - "${OFFICE_RENDERER_GID:-1001}"
      - "${PUBLIC_FETCH_GID:?PUBLIC_FETCH_GID is required}"
    networks:
      - private
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/session').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M

  dispatcher:
    <<: *worker
    env_file: ${DISPATCHER_ENV_FILE:?DISPATCHER_ENV_FILE is required}
    command: [node, /opt/app/node_modules/tsx/dist/cli.mjs, /opt/app/apps/api/src/job-process.ts, dispatcher]

  reference_worker:
    <<: *worker
    env_file: ${REFERENCE_WORKER_ENV_FILE:?REFERENCE_WORKER_ENV_FILE is required}
    command: [node, /opt/app/node_modules/tsx/dist/cli.mjs, /opt/app/apps/api/src/job-process.ts, worker]

  source_worker:
    <<: *worker
    env_file: ${SOURCE_WORKER_ENV_FILE:?SOURCE_WORKER_ENV_FILE is required}
    command: [node, /opt/app/node_modules/tsx/dist/cli.mjs, /opt/app/apps/api/src/source-worker.ts]
    environment:
      <<: *worker_environment
      PROTECTED_STORAGE_ROOT: /var/lib/investmentbanking/protected
      SOURCE_INSPECTOR_SOCKET: /run/office/source-repair.sock
    volumes:
      - ${APP_RELEASE_PATH}:/opt/app:ro
      - ${DATABASE_SSL_CA_HOST_PATH}:/run/secrets/supabase-chain.pem:ro
      - ${PROTECTED_VOLUME_PATH}:/var/lib/investmentbanking/protected:ro
      - ${OFFICE_SOCKET_DIRECTORY}:/run/office:ro
    group_add: ["${OFFICE_RENDERER_GID:-1001}"]

  workbook_worker:
    <<: *worker
    env_file: ${WORKBOOK_WORKER_ENV_FILE:?WORKBOOK_WORKER_ENV_FILE is required}
    command: [node, /opt/app/node_modules/tsx/dist/cli.mjs, /opt/app/apps/api/src/workbook-worker.ts]
    environment:
      <<: *worker_environment
      PROTECTED_STORAGE_ROOT: /var/lib/investmentbanking/protected
      OFFICE_RENDERER_SOCKET: /run/office/renderer.sock
    volumes:
      - ${APP_RELEASE_PATH}:/opt/app:ro
      - ${DATABASE_SSL_CA_HOST_PATH}:/run/secrets/supabase-chain.pem:ro
      - ${PROTECTED_VOLUME_PATH}:/var/lib/investmentbanking/protected
      - ${OFFICE_SOCKET_DIRECTORY}:/run/office:ro
      - ${ARTIFACT_IDENTITY_DIRECTORY}:/run/artifact-identity:ro
    group_add: ["${OFFICE_RENDERER_GID:-1001}"]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 768M, pids: 64 }

  public_fetch:
    <<: *worker
    user: "${PUBLIC_FETCH_UID:?PUBLIC_FETCH_UID is required}:${PUBLIC_FETCH_GID}"
    environment:
      PUBLIC_FETCH_SOCKET: /socket/fetch.sock
    command: [node, /service/server.mjs]
    working_dir: /service
    volumes:
      - ${APP_RELEASE_PATH}/services/public-fetch:/service:ro
      - ${PUBLIC_FETCH_SOCKET_DIRECTORY}:/socket
    networks: [public_fetch]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 64 }

  web:
    image: ${NODE_RUNTIME_IMAGE:-node:22-bookworm-slim}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    command:
      - node
      - /opt/web/apps/web/server.cjs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INVESTMENTBANKING_DEV_WEB_PORT:-3102}:3000"
    volumes:
      - type: bind
        source: ${WEB_RELEASE_PATH:?WEB_RELEASE_PATH must point to the web runtime release}
        target: /opt/web
        read_only: true
    networks:
      - private
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  public_fetch:
    name: investmentbanking-dev-public-fetch
  private:
    name: investmentbanking-dev-private
