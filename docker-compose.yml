services:
  postgres:
    image: investmentbanking-postgres:16-pgmq-1.5.1
    build: ./services/postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: investment_banking
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investment_banking"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - investment_banking_pg:/var/lib/postgresql/data
volumes:
  investment_banking_pg:
